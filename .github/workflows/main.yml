name: Direct_To_HuggingFace_CDN

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینکی m3u8 ی ڤیدیۆکە (بە تۆکنەکەیەوە)'
        required: true
      file_name:
        description: 'ناوی فایلەکە لەناو Hugging Face'
        required: true
        default: 'safetensors'
      referer_url:
        description: 'سەرچاوەی لینکەکە (بۆ تێپەڕاندنی 403 Forbidden)'
        required: true
        default: 'https://newlinehd.com/'

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq
          python -m pip install -U pip yt-dlp huggingface_hub

      - name: 🍪 Create Cookies File
        env:
          COOKIES: ${{ secrets.COOKIES_TXT }}
        run: |
          python3 -c "
          import os
          cookies = os.environ.get('COOKIES', '')
          with open('cookies.txt', 'w', encoding='utf-8') as f:
              # دڵنیابوونەوە لە بوونی هێدەری فەرمی بۆ ئەوەی yt-dlp قبوڵی بکات
              if '# Netscape HTTP Cookie File' not in cookies:
                  f.write('# Netscape HTTP Cookie File\n\n')
              f.write(cookies)
          "

      - name: ⬇️ Download Video (Bypass 403 Forbidden with Cookies)
        run: |
          yt-dlp \
            --cookies cookies.txt \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            --add-header "Referer: ${{ inputs.referer_url }}" \
            --add-header "Origin: https://newlinehd.com" \
            -o "safetensors" "${{ inputs.video_url }}"

      - name: 🚀 Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          python3 -c "
          import os
          from huggingface_hub import HfApi
          
          token = os.getenv('HF_TOKEN')
          if not token:
              print('❌ Error: HF_TOKEN is missing in GitHub Secrets!')
              exit(1)
              
          api = HfApi()
          repo_id = 'Sarko717227/Ai_SMART'
          file_name = os.getenv('FILE_NAME', 'safetensors')
          
          if not os.path.exists('safetensors') or os.path.getsize('safetensors') == 0:
              print('❌ Error: Download failed. File is missing or empty. (Likely IP Blocked by CDN)')
              exit(1)
          
          print(f'📤 Sending to Hugging Face: {file_name}...')
          
          api.upload_file(
              path_or_fileobj='safetensors',
              path_in_repo=file_name,
              repo_id=repo_id,
              repo_type='dataset',
              token=token
          )
          print('✅ Done! Check your Hugging Face repo.')
          "
