name: Direct_To_HuggingFace_CDN
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینکی ڤیدیۆکە (M3U8)'
        required: true
      file_name:
        description: 'ناوی فایلەکە'
        required: true
        default: 'video.mp4'
      referer_url:
        description: 'Referer URL'
        required: true
        default: 'https://videostr.net/'

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq
          python -m pip install -U pip huggingface_hub

      - name: ⬇️ Download Video using FFmpeg
        run: |
          # لێرەدا ڕاستەوخۆ FFmpeg بەکاردێنین بۆ داگرتن
          # ئەم ڕێگەیە زۆرجار پاراستنی 403 دەبڕێت کە yt-dlp ناتوانێ
          ffmpeg -hide_banner -loglevel error \
            -headers "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -headers "Referer: ${{ github.event.inputs.referer_url }}" \
            -headers "Origin: https://videostr.net" \
            -i "${{ github.event.inputs.video_url }}" \
            -c copy -bsf:a aac_adtstoasc "video.mp4"

      - name: 🚀 Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "
          import os
          from huggingface_hub import HfApi
          
          token = os.getenv('HF_TOKEN')
          api = HfApi()
          repo_id = 'Sarkoakram/sarko761'
          file_name = '${{ github.event.inputs.file_name }}'
          
          if os.path.exists('video.mp4'):
              print(f'📤 Sending to Hugging Face: {file_name}...')
              api.upload_file(
                  path_or_fileobj='video.mp4',
                  path_in_repo=file_name,
                  repo_id=repo_id,
                  repo_type='dataset',
                  token=token
              )
              print('✅ Done!')
          else:
              print('❌ Error: Download failed (video.mp4 not found).')
              exit(1)
          "
