name: Direct_To_HuggingFace_CDN

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینکی Embed ی ڤیدیۆکە لێرە دابنێ (نەک m3u8)'
        required: true
      file_name:
        description: 'ناوی فایلەکە لەناو Hugging Face'
        required: true
        default: 'safetensors'
      referer_url:
        description: 'سەرچاوەی لینکەکە (بۆ تێپەڕاندنی 403 Forbidden)'
        required: true
        default: 'https://newlinehd.com/'

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗️ Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq
          # دڵنیابوونەوە لە دامەزراندنی تەواوەتی پێداویستییەکانی yt-dlp و curl-cffi
          python -m pip install -U pip
          python -m pip install -U "yt-dlp[default]" curl-cffi huggingface_hub

      - name: 🍪 Create Cookies File
        env:
          COOKIES: ${{ secrets.COOKIES_TXT }}
        run: |
          python3 -c "
          import os
          cookies = os.environ.get('COOKIES', '')
          if cookies:
              with open('cookies.txt', 'w', encoding='utf-8') as f:
                  if '# Netscape HTTP Cookie File' not in cookies:
                      f.write('# Netscape HTTP Cookie File\n\n')
                  f.write(cookies)
          "

      - name: ⬇️ Download Video (Bypass BunnyCDN & Cloudflare)
        run: |
          if [ -f "cookies.txt" ]; then
            COOKIE_CMD="--cookies cookies.txt"
          else
            COOKIE_CMD=""
          fi

          # بەکارهێنانی impersonate بە گشتی بەبێ دیاریکردنی ڤێرژنی سەیر
          yt-dlp $COOKIE_CMD \
            --impersonate chrome \
            --extractor-args "generic:impersonate" \
            --referer "${{ inputs.referer_url }}" \
            --add-header "Origin: https://newlinehd.com" \
            --add-header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            --add-header "Accept-Language: en-US,en;q=0.5" \
            --no-check-certificate \
            --format "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            -o "safetensors.mp4" "${{ inputs.video_url }}"
            
          mv "safetensors.mp4" "safetensors"

      - name: 🚀 Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          python3 -c "
          import os
          from huggingface_hub import HfApi
          
          token = os.getenv('HF_TOKEN')
          if not token:
              print('❌ Error: HF_TOKEN is missing in GitHub Secrets!')
              exit(1)
              
          api = HfApi()
          repo_id = 'Sarko717227/Ai_SMART'
          file_name = os.getenv('FILE_NAME', 'safetensors')
          
          if not os.path.exists('safetensors') or os.path.getsize('safetensors') == 0:
              print('❌ Error: Download failed. File is missing or empty. (Likely Blocked by CDN)')
              exit(1)
          
          print(f'📤 Sending to Hugging Face: {file_name}...')
          
          api.upload_file(
              path_or_fileobj='safetensors',
              path_in_repo=file_name,
              repo_id=repo_id,
              repo_type='dataset',
              token=token
          )
          print('✅ Done! Check your Hugging Face repo.')
          "
